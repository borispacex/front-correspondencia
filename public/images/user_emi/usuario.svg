    <polygon points="63,186 93,142 93,166 75,186" fill="#0D1F3C"/>
    <polygon points="137,186 107,142 107,166 125,186" fill="#0D1F3C"/>
    <line x1="100" y1="156" x2="100" y2="186" stroke="#091527" stroke-width="1" mask="url(#imagine-text-gaps-czkxwu)"/>
    <!-- Botones dorados -->
    <circle cx="100" cy="163" r="1.5" fill="#F0C020"/>
    <circle cx="100" cy="173" r="1.5" fill="#F0C020"/>
    <!-- Cuello camisa blanca -->
    <polygon points="91,143 100,153 109,143 107,136 93,136" fill="#F5F5F5"/>
    <polygon points="93,143 100,150 107,143" fill="#0D1F3C"/>
    <!-- Pañuelo dorado bolsillo -->
    <polygon points="75,154 85,153 84,160 74,159" fill="#F0C020"/>

    <!-- Cuello piel -->
    <rect x="90" y="126" width="20" height="16" rx="6" fill="#F2C18D"/>

    <!-- Cabeza -->
    <ellipse cx="100" cy="103" rx="34" ry="36" fill="#F2C18D"/>

    <!-- Cabello -->
    <ellipse cx="100" cy="72" rx="34" ry="15" fill="#3A2510"/>
    <rect x="66" y="72" width="68" height="14" fill="#3A2510"/>
    <ellipse cx="87" cy="80" rx="11" ry="6" fill="#3A2510"/>
    <ellipse cx="97" cy="79" rx="8" ry="5" fill="#3A2510"/>

    <!-- Orejas -->
    <ellipse cx="66" cy="104" rx="5" ry="7" fill="#E8A87C"/>
    <ellipse cx="134" cy="104" rx="5" ry="7" fill="#E8A87C"/>

    <!-- Ojos -->
    <ellipse cx="89" cy="101" rx="6" ry="5" fill="#fff"/>
    <ellipse cx="111" cy="101" rx="6" ry="5" fill="#fff"/>
    <circle cx="90" cy="102" r="3" fill="#3A2510"/>
    <circle cx="112" cy="102" r="3" fill="#3A2510"/>
    <circle cx="91" cy="101" r="1.2" fill="#fff"/>
    <circle cx="113" cy="101" r="1.2" fill="#fff"/>

    <!-- Cejas -->
    <path d="M83 94 Q89 91 95 94" fill="none" stroke="#3A2510" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M105 94 Q111 91 117 94" fill="none" stroke="#3A2510" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Nariz -->
