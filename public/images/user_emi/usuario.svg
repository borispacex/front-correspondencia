<svg width="200" height="200" viewBox="0 0 200 200" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Usuario civil con traje azul marino</title>
  <desc>Avatar de usuario civil con traje azul marino, corbata dorada, fondo institucional azul y dorado</desc>
  <defs>
    <clipPath id="cc1"><circle cx="100" cy="88" r="75"/></clipPath>
    <mask id="imagine-text-gaps-czkxwu" maskUnits="userSpaceOnUse"><rect x="0" y="0" width="200" height="200" fill="white"/><rect x="81" y="166" width="38" height="13" fill="black" rx="2"/></mask>
  </defs>

  <circle cx="100" cy="88" r="75" fill="#1A3A6B"/>
  <clipPath id="dg1"><circle cx="100" cy="88" r="75"/></clipPath>
